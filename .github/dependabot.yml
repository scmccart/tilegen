# Version updates for the workflows' actions. commitlint isn't covered: it
# runs through npx with its version pinned in scripts/lint-commits and moved
# by hand (see CLAUDE.md).
#
# The subjects read `chore(deps): bump …` (Dependabot adds the scope and the
# colon), which CI's commit check accepts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
